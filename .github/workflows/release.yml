name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # needed to create GitHub Releases

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-and-release:
    name: Build & Release (Windows x64)
    runs-on: windows-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── MSVC environment (gives us rc.exe, cl.exe, lib.exe, link.exe) ────
      - name: Set up MSVC Developer Environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # ── Rust toolchain (MSVC target — no fake-gcc workaround needed) ──────
      - name: Install Rust stable (MSVC x64)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-msvc-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-msvc-

      # ── Node / npm ────────────────────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ── Build Rust workspace ──────────────────────────────────────────────
      - name: Build Rust workspace (release, MSVC)
        run: cargo build --workspace --release
        # Uses x86_64-pc-windows-msvc — no .cargo/config.toml override needed

      # ── Compile IME resource file with rc.exe (Windows SDK) ───────────────
      - name: Compile IME resource file
        run: |
          rc /fo target\release\NativeBanglaIME.res `
             native\windows-ime\resources\NativeBanglaIME.rc
        shell: cmd

      # ── Build NativeBanglaIME.dll with MSVC cl.exe ────────────────────────
      # Note: Rust MSVC cdylib produces ime_bridge.dll + ime_bridge.dll.lib
      - name: Build NativeBanglaIME.dll (MSVC)
        run: |
          set SRCDIR=native\windows-ime\src
          set INCDIR=native\windows-ime\include

          :: ime_bridge.dll.lib is the MSVC import library generated by cargo (cdylib)
          cl.exe /std:c++20 /EHsc /W3 /DUNICODE /D_UNICODE /DWIN32_LEAN_AND_MEAN ^
            /I%INCDIR% /I%SRCDIR% ^
            /LD ^
            %SRCDIR%\DllMain.cpp ^
            %SRCDIR%\ClassFactory.cpp ^
            %SRCDIR%\TextService.cpp ^
            %SRCDIR%\Composition.cpp ^
            %SRCDIR%\CandidateList.cpp ^
            target\release\NativeBanglaIME.res ^
            /Fe:target\release\NativeBanglaIME.dll ^
            /link ^
            /DEF:native\windows-ime\src\NativeBanglaIME.def ^
            /LIBPATH:target\release ^
            ime_bridge.dll.lib ^
            msctf.lib uuid.lib ole32.lib advapi32.lib user32.lib gdi32.lib ^
            /IGNORE:4070
        shell: cmd

      # ── Build Desktop UI ──────────────────────────────────────────────────
      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build desktop UI
        working-directory: apps/desktop
        run: npm run build

      # ── Bundle release package ────────────────────────────────────────────
      - name: Bundle release artifacts
        id: bundle
        shell: pwsh
        run: |
          $version    = "${{ github.ref_name }}" -replace '^v',''
          $releaseDir = "dist\release"
          $zipName    = "NativeBangla-v${version}-windows-x64.zip"
          $zipPath    = "dist\$zipName"

          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          New-Item -ItemType Directory -Force dist          | Out-Null

          # Core DLLs
          Copy-Item "target\release\NativeBanglaIME.dll" $releaseDir
          Copy-Item "target\release\ime_bridge.dll"      $releaseDir

          # MSVC runtime DLLs are part of Windows 10+, no need to bundle separately.
          # Only bundle if ime_bridge was built with GNU toolchain (add libunwind.dll).
          # For MSVC builds this is not needed.

          # Seed dictionary
          $dictSrc = "resources\dictionaries\bn-core-seed.json"
          if (Test-Path $dictSrc) {
            New-Item -ItemType Directory -Force "$releaseDir\resources\dictionaries" | Out-Null
            Copy-Item $dictSrc "$releaseDir\resources\dictionaries\"
            Write-Host "  Copied bn-core-seed.json"
          }

          # Installer scripts
          Copy-Item "installer\install.ps1"   $releaseDir
          Copy-Item "installer\uninstall.ps1" $releaseDir

          # README
          $readme = @(
            "Native Bangla IME v${version}",
            "================================",
            "",
            "INSTALLATION (requires Administrator)",
            "--------------------------------------",
            "1. Right-click install.ps1 -> Run with PowerShell (as Administrator)",
            "   OR open an elevated PowerShell and run:",
            "      Set-ExecutionPolicy Bypass -Scope Process -Force",
            "      .\install.ps1",
            "",
            "UNINSTALL",
            "---------",
            "   .\uninstall.ps1   (as Administrator)",
            "",
            "REQUIREMENTS",
            "------------",
            "- Windows 10 or later (x64)",
            "- Bengali (Bangladesh) language pack installed in Windows Settings",
            "",
            "AFTER INSTALL",
            "-------------",
            "Go to: Settings > Time & Language > Language > Add a language",
            "Add Bengali (Bangladesh) and select 'Native Bangla IME' as input method."
          )
          $readme | Set-Content "$releaseDir\README.txt" -Encoding UTF8

          # Zip
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath -Force

          echo "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          echo "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          echo "version=$version"  >> $env:GITHUB_OUTPUT
          Write-Host "Packaged: $zipPath ($([math]::Round((Get-Item $zipPath).Length/1MB,2)) MB)"

      # ── Create GitHub Release ─────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Native Bangla IME ${{ github.ref_name }}"
          body: |
            ## Native Bangla IME ${{ github.ref_name }}

            A high-performance, offline-first Bangla input method for Windows.

            ### Download & Install

            1. Download `NativeBangla-${{ github.ref_name }}-windows-x64.zip`
            2. Extract the zip
            3. Right-click `install.ps1` -> **Run with PowerShell (as Administrator)**
            4. Log off and back on
            5. Go to **Settings > Time & Language > Language**, add Bengali (Bangladesh) and select **Native Bangla IME**

            ### Contents

            | File | Description |
            |------|-------------|
            | `NativeBanglaIME.dll` | Windows TSF IME (registered via regsvr32) |
            | `ime_bridge.dll` | Rust phonetic engine bridge |
            | `resources/dictionaries/bn-core-seed.json` | Core Bangla dictionary |
            | `install.ps1` | Installer (run as Administrator) |
            | `uninstall.ps1` | Uninstaller |

            ### Requirements
            - Windows 10 x64 or later
            - Bengali (Bangladesh) language pack

          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            ${{ steps.bundle.outputs.zip_path }}
          generate_release_notes: true
