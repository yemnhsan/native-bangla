[workspace]
resolver = "2"
members = [
    "crates/phonetic-engine",
    "crates/prediction-engine",
    "crates/dictionary-core",
    "crates/user-preferences",
    "crates/ime-bridge",
    "crates/native-engine",
    "tools/dictionary-builder",
    "tools/benchmarking",
]
default-members = [
    "crates/phonetic-engine",
    "crates/prediction-engine",
    "crates/dictionary-core",
    "crates/user-preferences",
    "crates/ime-bridge",
    "crates/native-engine",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Native Bangla Contributors"]
repository = "https://github.com/native-bangla/native-bangla"
homepage = "https://nativebangla.org"
description = "Native Bangla — Type Naturally. Write Beautifully."
rust-version = "1.75"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
unicode-segmentation = "1"
unicode-normalization = "0.1"
once_cell = "1"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
clap = { version = "4", features = ["derive"] }
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = "symbols"

[profile.bench]
inherits = "release"
